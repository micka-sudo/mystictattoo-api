name: Sync Frontend Build

#===============================================================================
# MYSTIC TATTOO - Synchronisation Frontend → API
#===============================================================================
# Workflow STRICT: release/X.X.X → staging → master
# Basé sur deploy.sh
#===============================================================================

on:
  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type de version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      deploy_to:
        description: 'Étape de déploiement'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - staging
          - master

  # Déclenchement automatique depuis le repo frontend
  repository_dispatch:
    types: [frontend-build]

env:
  FRONTEND_REPO: micka-sudo/mystictattoo-chat
  FRONTEND_PATH: mystictattoo-react
  NODE_VERSION: '20'
  MAIN_BRANCH: master
  STAGING_BRANCH: staging

jobs:
  #=============================================================================
  # ÉTAPE 1: Build Frontend + Création Release
  #=============================================================================
  create-release:
    name: "📦 Créer Release"
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_to == 'release' || github.event_name == 'repository_dispatch' }}
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      release_branch: ${{ steps.version.outputs.release_branch }}

    steps:
      - name: "📥 Checkout API repo"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}
          fetch-depth: 0

      - name: "📥 Checkout Frontend repo"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: master
          path: frontend-temp

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-temp/${{ env.FRONTEND_PATH }}/package-lock.json

      - name: "📦 Install & Build frontend"
        working-directory: frontend-temp/${{ env.FRONTEND_PATH }}
        run: |
          npm ci
          npm run build

      - name: "🔢 Calculer nouvelle version"
        id: version
        run: |
          # Récupérer la dernière version depuis les tags
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1 || echo "v0.0.0")
          CURRENT_VERSION=${LATEST_TAG#v}

          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="0.0.0"
          fi

          # Parser la version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Incrémenter selon le type
          VERSION_TYPE="${{ inputs.version_type || 'patch' }}"
          case "$VERSION_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|*) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          RELEASE_BRANCH="release/$NEW_VERSION"

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT

          echo "============================================="
          echo "  Version: v$CURRENT_VERSION → v$NEW_VERSION"
          echo "  Branche: $RELEASE_BRANCH"
          echo "============================================="

      - name: "🌿 Créer branche release"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # S'assurer d'être sur master à jour
          git checkout ${{ env.MAIN_BRANCH }}
          git pull origin ${{ env.MAIN_BRANCH }}

          # Créer la branche release
          git checkout -b ${{ steps.version.outputs.release_branch }}

      - name: "🔄 Sync build → client/build"
        run: |
          rm -rf client/build
          cp -r frontend-temp/${{ env.FRONTEND_PATH }}/build client/build

      - name: "📝 Mettre à jour package.json"
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.new_version }}"/' package.json

      - name: "💾 Commit & Push release"
        run: |
          git add client/build .gitignore package.json

          git commit -m "feat: sync frontend build v${{ steps.version.outputs.new_version }}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>"

          git push -u origin ${{ steps.version.outputs.release_branch }}

      - name: "✅ Release créée"
        run: |
          echo "============================================="
          echo "  ✅ ÉTAPE 1/3: RELEASE CRÉÉE"
          echo "============================================="
          echo ""
          echo "  Branche: ${{ steps.version.outputs.release_branch }}"
          echo "  Version: v${{ steps.version.outputs.new_version }}"
          echo ""
          echo "  Prochaine étape: Merge vers staging"
          echo "  → Lancer le workflow avec deploy_to=staging"
          echo "============================================="

  #=============================================================================
  # ÉTAPE 2: Merge Release → Staging
  #=============================================================================
  merge-to-staging:
    name: "🧪 Merge vers Staging"
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_to == 'staging' }}

    steps:
      - name: "📥 Checkout API repo"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}
          fetch-depth: 0

      - name: "🔍 Trouver la branche release"
        id: find_release
        run: |
          git fetch origin --prune

          # Trouver la dernière branche release
          RELEASE_BRANCH=$(git branch -r | grep "origin/release/" | sort -V | tail -1 | tr -d ' ' | sed 's|origin/||')

          if [ -z "$RELEASE_BRANCH" ]; then
            echo "❌ Aucune branche release trouvée"
            exit 1
          fi

          VERSION=$(echo "$RELEASE_BRANCH" | sed 's|release/||')

          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Branche release trouvée: $RELEASE_BRANCH"

      - name: "🔀 Merge release → staging"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Checkout release
          git checkout ${{ steps.find_release.outputs.release_branch }}
          git pull origin ${{ steps.find_release.outputs.release_branch }}

          # Créer/checkout staging
          if git show-ref --verify --quiet refs/remotes/origin/${{ env.STAGING_BRANCH }}; then
            git checkout ${{ env.STAGING_BRANCH }}
            git pull origin ${{ env.STAGING_BRANCH }}
          else
            git checkout -b ${{ env.STAGING_BRANCH }}
          fi

          # Merge
          git merge ${{ steps.find_release.outputs.release_branch }} -m "Merge ${{ steps.find_release.outputs.release_branch }} into ${{ env.STAGING_BRANCH }}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          git push -u origin ${{ env.STAGING_BRANCH }}

      - name: "🧹 Supprimer branche release"
        run: |
          # Supprimer la branche release distante
          git push origin --delete ${{ steps.find_release.outputs.release_branch }} || true
          echo "Branche ${{ steps.find_release.outputs.release_branch }} supprimée"

      - name: "✅ Staging mis à jour"
        run: |
          echo "============================================="
          echo "  ✅ ÉTAPE 2/3: STAGING MIS À JOUR"
          echo "============================================="
          echo ""
          echo "  Version: v${{ steps.find_release.outputs.version }}"
          echo "  Branche release supprimée"
          echo ""
          echo "  Prochaine étape: Déployer en production"
          echo "  → Lancer le workflow avec deploy_to=master"
          echo "============================================="

  #=============================================================================
  # ÉTAPE 3: Merge Staging → Master + Tag + Release
  #=============================================================================
  deploy-to-master:
    name: "🚀 Déployer en Production"
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_to == 'master' }}

    steps:
      - name: "📥 Checkout API repo"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}
          fetch-depth: 0

      - name: "🔍 Récupérer la version depuis staging"
        id: get_version
        run: |
          git fetch origin --prune
          git checkout ${{ env.STAGING_BRANCH }}
          git pull origin ${{ env.STAGING_BRANCH }}

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"

      - name: "🔀 Merge staging → master"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout ${{ env.MAIN_BRANCH }}
          git pull origin ${{ env.MAIN_BRANCH }}

          git merge ${{ env.STAGING_BRANCH }} -m "Release ${{ steps.get_version.outputs.version }} - Merge staging into ${{ env.MAIN_BRANCH }}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          git push origin ${{ env.MAIN_BRANCH }}

      - name: "🏷️ Créer tag"
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"

          if ! git tag -l "$TAG" | grep -q .; then
            git tag -a "$TAG" -m "Release ${{ steps.get_version.outputs.version }}

            🤖 Generated with [Claude Code](https://claude.com/claude-code)"

            git push origin --tags
            echo "Tag $TAG créé"
          else
            echo "Tag $TAG existe déjà"
          fi

      - name: "📦 Créer GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"

          # Récupérer les commits depuis le dernier tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" | head -15)
          else
            COMMITS="- Initial release"
          fi

          gh release create "$TAG" \
            --title "Release ${{ steps.get_version.outputs.version }}" \
            --notes "## Release ${{ steps.get_version.outputs.version }}

          ### Changements
          $COMMITS

          ---
          🤖 Generated with [Claude Code](https://claude.com/claude-code)" || echo "Release existe déjà"

      - name: "🚀 Déploiement terminé"
        run: |
          echo "============================================="
          echo "  🚀 ÉTAPE 3/3: PRODUCTION DÉPLOYÉE"
          echo "============================================="
          echo ""
          echo "  Version: v${{ steps.get_version.outputs.version }}"
          echo "  Tag: v${{ steps.get_version.outputs.version }}"
          echo "  GitHub Release créée"
          echo ""
          echo "  Render va automatiquement redéployer."
          echo "============================================="
